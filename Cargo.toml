[package]
name = "cohete"
version = "0.1.0"
edition = "2021"
authors = ["PAIML <team@paiml.com>"]
license = "MIT"
description = "Nightly E2E verification for the sovereign AI stack on Jetson edge hardware"
repository = "https://github.com/paiml/cohete"
readme = "README.md"
keywords = ["jetson", "e2e", "verification", "nightly", "edge"]
categories = ["development-tools::testing"]
rust-version = "1.75"

[[bin]]
name = "cohete"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
