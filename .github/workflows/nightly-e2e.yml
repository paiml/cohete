name: Nightly E2E

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC — after forjar provisions at 05:00
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    runs-on: [self-hosted, jetson]  # jetson orin nano
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Build cohete
        run: cargo build --release

      - name: Ensure model available
        run: |
          # Pull GGUF model if not already cached
          # --skip-contract: PMAT-237 tensor naming QA is not an inference blocker;
          # cohete UAT validates inference correctness directly.
          if ! ls ~/.cache/pacha/models/*.gguf 1>/dev/null 2>&1; then
            apr pull --skip-contract \
              hf://Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
          fi

          # Create .apr format copy if not present (proves both formats)
          if ! ls ~/.cache/pacha/models/*.apr 1>/dev/null 2>&1; then
            GGUF=$(ls -t ~/.cache/pacha/models/*.gguf | head -1)
            apr import "$GGUF" -o ~/.cache/pacha/models/qwen-1.5b-q4k.apr --preserve-q4k \
              || echo "WARN: apr import failed — U3-003 format parity will test GGUF only"
          fi

      - name: Run verification (all 5 tiers)
        run: ./target/release/cohete verify --output artifacts/latest --allow-missing

      - name: Copy to history
        if: always()
        run: |
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p artifacts/history
          if [ -f artifacts/latest/summary.json ]; then
            cp artifacts/latest/summary.json "artifacts/history/${DATE}.json"
          else
            echo "WARN: no summary.json — verification may have failed"
          fi

      - name: Generate status SVG and update README
        if: always()
        run: |
          if [ -f artifacts/latest/summary.json ]; then
            python3 scripts/generate-status.py
          else
            echo "WARN: no summary.json — skipping status generation"
          fi

      - name: Commit artifacts + status
        if: always()
        run: |
          git config user.name "cohete-bot"
          git config user.email "cohete@paiml.com"
          git add artifacts/history/ README.md
          PASS_STATUS=$(python3 -c "import json; d=json.load(open('artifacts/latest/summary.json')); print('pass' if d.get('pass') else 'FAIL')" 2>/dev/null || echo "FAIL")
          git diff --cached --quiet || git commit -m "nightly: $(date -u +%Y-%m-%d) [${PASS_STATUS}]"
          git push

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_number }}
          path: artifacts/latest/
          retention-days: 90
